<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmniShot</title>
    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}" type="image/x-icon">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <!-- 仕様: docs/spec/setup-guide.md（接続確認。「接続確認」ボタンで開き、開いている間、端末の状態を2秒ごとに更新する） -->
    <div id="connectionModal" class="preview-modal" style="display: none; z-index: 2000;">
        <div class="preview-content connection-content">
            <h2 class="connection-title">🔌 接続確認</h2>
            <p class="connection-lead">接続した端末が、撮影できる状態かを確認します。</p>

            <!-- iPhone と Android は横に並べる（狭い幅では縦に並べる）。内容が長いときは、ここだけスクロールする -->
            <div class="connection-body">
            <div class="connection-columns">
                <section class="connection-column">
                    <h3 class="connection-section">🍏 iPhone <a href="{{ url_for('help_page') }}#ios" class="setup-link connection-help-link">手順を見る</a></h3>
                    <div id="iosStatus" class="setup-status"></div>
                </section>
                <section class="connection-column">
                    <h3 class="connection-section">🤖 Android <a href="{{ url_for('help_page') }}#android" class="setup-link connection-help-link">手順を見る</a></h3>
                    <div id="androidStatus" class="setup-status"></div>
                </section>
            </div>
            </div>

            <hr class="connection-divider">
            <div class="connection-footer">
                <button id="closeConnectionBtn" class="btn start" style="padding: 8px 20px;">閉じる</button>
            </div>
        </div>
    </div>


    <div class="header">
        <!-- 仕様: docs/spec/update-notification.md（新しい版があるときだけ表示する通知） -->
        <div id="updateBanner" class="update-banner" style="display: none;">
            <span id="updateMessage" class="update-message"></span>
            <button id="updateOpenBtn" class="btn btn-info update-btn">ダウンロードページを開く</button>
            <button id="updateCloseBtn" class="btn btn-secondary update-btn">閉じる</button>
        </div>
        <div class="header-top">
            <h1><img src="{{ url_for('static', filename='app-icon.png') }}" alt="" class="app-icon"> OmniShot</h1>
            <div class="header-actions">
                <!-- 仕様: docs/spec/setup-guide.md（接続確認。「使い方」の左に置く。撮影中も押せる） -->
                <button id="connectionCheckBtn" class="btn header-btn header-help" title="端末の準備の状態を確認">🔌 接続確認</button>
                <a href="{{ url_for('help_page') }}" class="btn header-btn header-help">ℹ️ 使い方</a>
                <button id="shutdownBtn" class="btn btn-danger header-btn header-exit">🛑 アプリ終了</button>
            </div>
        </div>
        
        <!-- 仕様: docs/spec/device-selection.md#実現内容what（設定欄は2行構成） -->
        <!-- 仕様: docs/spec/screenshot-capture.md#実現内容what（設定の初期値） -->
        <div class="control-panel">
            <div class="control-row control-row-conditions">
                <label class="field">
                    <span class="field-caption">チェック間隔</span>
                    <span class="input-unit"><input type="number" id="checkInterval" value="0.3" step="0.1" min="0.1" max="30"><span class="unit">s</span></span>
                </label>

                <label class="field" id="staticLabel" style="display: inline;">
                    <span class="field-caption">静止待ち時間</span>
                    <span class="input-unit"><input type="number" id="settlingTime" value="1" step="0.1" min="0.1" max="30"><span class="unit">s</span></span>
                </label>

                <label class="field" id="dynamicLabel" style="display: none;">
                    <span class="field-caption">判定回数</span>
                    <span class="input-unit"><input type="number" id="judgeCount" value="3" min="1" max="10"><span class="unit">回</span></span>
                </label>

                <label class="field">
                    <span class="field-caption">モード</span>
                    <select id="modeSelect">
                        <option value="static">静的モード</option>
                        <option value="dynamic">動的モード</option>
                    </select>
                </label>
            </div>

            <div class="control-row control-row-actions">
                <label class="field field-device">
                    <span class="field-caption">端末</span>
                    <select id="deviceSelect">
                        <option value="">検出中...</option>
                    </select>
                </label>
                <button id="refreshDevicesBtn" class="btn btn-refresh" title="端末の一覧を更新">🔄 更新</button>

                <div class="action-group">
                    <!-- 仕様: docs/spec/manual-capture.md -->
                    <button id="manualCaptureBtn" class="btn manual-capture">手動撮影</button>
                    <button id="startBtn" class="btn start">自動撮影</button>
                    <button id="stopBtn" class="btn stop">停止</button>
                    <span id="status">Status: Idle</span>
                </div>
            </div>
        </div>

        <div class="controls" style="flex-wrap: nowrap; overflow-x: auto; justify-content: space-between; align-items: center; width: 100%;">
            <div style="display: flex; gap: 10px;">
                <button id="selectAllBtn" class="btn btn-info">全選択</button>
                <button id="deselectAllBtn" class="btn btn-secondary" style="display: none;">選択解除</button>
                <button id="deleteSelectedBtn" class="btn stop" style="display: none;">消去 (<span id="selectCount">0</span>)</button>
                <button id="downloadBtn" class="btn btn-info" style="display: none;">ダウンロード (<span id="downloadCount">0</span>)</button>
            </div>

            <div style="display: flex; gap: 10px; align-items: center;">
                <select id="deviceFilter">
                    <option value="all">全デバイス</option>
                    <option value="ios">iOS のみ</option>
                    <option value="android">Android のみ</option>
                </select>

                <select id="sortSelect">
                    <option value="desc">新しい順</option>
                    <option value="asc">古い順</option>
                </select>
            </div>
        </div>

        <div class="log-container">
            <div id="logConsole" class="log-console"></div>
        </div>
        <span class="header-note">選択した画像をzipファイルでダウンロードできます。ファイル名をクリックして変更できます。</span>
    </div>
    
    <div id="gallery" class="gallery"></div>

    <div id="previewModal" class="preview-modal" style="display: none;">
        <div class="preview-content">
            <button id="closeModalBtn" class="close-modal">&times;</button>
            <button id="prevBtn" class="nav-btn prev-btn">&#10094;</button>
            
            <img id="previewImage" src="" alt="Preview">
            
            <div class="preview-actions-corner">
                <button id="previewDownloadBtn" class="action-btn download-btn" title="ダウンロード">📥</button>
                <button id="previewDeleteBtn" class="action-btn delete-btn" title="削除">🗑️</button>
            </div>

            <button id="nextBtn" class="nav-btn next-btn">&#10095;</button>
            <div id="previewInfo" class="preview-info"></div>
        </div>
    </div>

    <script type="module" src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
